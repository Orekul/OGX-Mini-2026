name: Build OGX-Mini Pico 2 W

on:
  push:
    branches: [ "custom-11a-pico2w-reconnect" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Get Pico SDK
        run: git clone --branch 2.1.0 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git

      - name: Build OGX-Mini for PI_PICO2W
        run: |
          mkdir -p build output
          cd build
          cmake -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
                -DCMAKE_BUILD_TYPE=Release \
                -DOGXM_BOARD=PI_PICO2W \
                -DMAX_GAMEPADS=1 \
                ../Firmware/RP2040
          cmake --build .
          FILE=$(find . -type f -name "*.uf2" | head -n 1)
          echo "UF2 found: $FILE"
          test -n "$FILE"
          cp "$FILE" ../output/OGX-Mini-v1.0.0.11a-PI_PICO2W-Reconnect.uf2

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uf2-PI_PICO2W-reconnect
          path: output/OGX-Mini-v1.0.0.11a-PI_PICO2W-Reconnect.uf2
